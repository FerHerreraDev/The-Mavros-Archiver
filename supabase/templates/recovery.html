<!-- Supabase > Authentication > Emails > Reset password. Subject: Reset your Mavros Archiver password -->
<div style="background:#000;padding:48px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#111;border:1px solid #222;border-radius:16px;padding:40px 32px;text-align:center;">
    <h1 style="margin:0 0 8px;font-size:22px;letter-spacing:-0.5px;color:#e5e5e5;">
      THE MAVROS <span style="color:#e5484d;">ARCHIVER</span>
    </h1>
    <p style="margin:0 0 28px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:1px;color:#888;text-transform:uppercase;">Recover access</p>
    <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#bbb;">Someone asked to reset the password for this account. Click below to choose a new one.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/set-password"
       style="display:inline-block;background:#fafafa;color:#000;text-decoration:none;font-weight:600;font-size:14px;padding:14px 32px;border-radius:999px;">Choose new password</a>
    <p style="margin:28px 0 0;font-size:12px;line-height:1.5;color:#666;">If you didn't ask for this, you can ignore this email. Your password won't change.</p>
  </div>
</div>
